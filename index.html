<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f0f0;
        }
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            min-height: 30px;
        }
        #score {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Rock, Paper, Scissors Game</h1>
        <div class="buttons">
            <button id="rock">Rock</button>
            <button id="paper">Paper</button>
            <button id="scissors">Scissors</button>
        </div>
        <div id="result"></div>
        <div id="score"></div>
    </div>

    <script>
        let playerScore = 0;
        let computerScore = 0;

        const rockBtn = document.getElementById('rock');
        const paperBtn = document.getElementById('paper');
        const scissorsBtn = document.getElementById('scissors');
        const resultDiv = document.getElementById('result');
        const scoreDiv = document.getElementById('score');

        rockBtn.addEventListener('click', () => playRound('rock'));
        paperBtn.addEventListener('click', () => playRound('paper'));
        scissorsBtn.addEventListener('click', () => playRound('scissors'));

        function playRound(playerSelection) {
            if (playerScore >= 5 || computerScore >= 5) return;

            const choices = ['rock', 'paper', 'scissors'];
            const computerSelection = choices[Math.floor(Math.random() * 3)];
            const roundResult = getResult(playerSelection, computerSelection);
            
            if (roundResult.includes('Win')) playerScore++;
            if (roundResult.includes('Lose')) computerScore++;
            
            resultDiv.textContent = `You chose ${playerSelection}, computer chose ${computerSelection}. ${roundResult}`;
            scoreDiv.textContent = `Player: ${playerScore} | Computer: ${computerScore}`;
            
            if (playerScore >= 5 || computerScore >= 5) {
                const winner = playerScore > computerScore ? 'Player' : 'Computer';
                resultDiv.textContent += `\n\nGame Over! ${winner} wins the game!`;
                
                [rockBtn, paperBtn, scissorsBtn].forEach(btn => {
                    btn.style.opacity = '0.6';
                    btn.style.cursor = 'not-allowed';
                });
                
                const restartBtn = document.createElement('button');
                restartBtn.textContent = 'Play Again';
                restartBtn.addEventListener('click', restartGame);
                resultDiv.appendChild(document.createElement('br'));
                resultDiv.appendChild(document.createElement('br'));
                resultDiv.appendChild(restartBtn);
            }
        }

        function getResult(player, computer) {
            if (player === computer) return 'Tie!';
            if (
                (player === 'rock' && computer === 'scissors') ||
                (player === 'paper' && computer === 'rock') ||
                (player === 'scissors' && computer === 'paper')
            ) return 'You Win!';
            return 'You Lose!';
        }

        function restartGame() {
            playerScore = 0;
            computerScore = 0;
            resultDiv.textContent = '';
            scoreDiv.textContent = '';
            [rockBtn, paperBtn, scissorsBtn].forEach(btn => {
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            });
            const restartBtn = document.querySelector('#result button');
            if (restartBtn) restartBtn.remove();
        }
    </script>
</body>
